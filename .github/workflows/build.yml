name: Build Theos Tweak

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
      - name: Setup Theos SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/sdks
          mv $HOME/sdks/iPhoneOS16.5.sdk $HOME/theos/sdks/
          
      - name: Install ldid
        run: |
          brew install ldid

      - name: Build Package
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload Deb
        uses: actions/upload-artifact@v3
        with:
          name: ktemp-package
          path: packages/*.deb
